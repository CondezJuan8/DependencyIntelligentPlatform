spring:
  application:
    name: dependency-intelligence
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:dependency_intelligence}
    username: ${DB_RUNTIME_USER:dependency_app}
    password: ${POSTGRES_APP_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    user: ${MIGRATION_USER:${POSTGRES_USER:dependency}}
    password: ${MIGRATION_PASSWORD:${POSTGRES_PASSWORD}}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 3000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 3000
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
app:
  organization:
    invitation-lifetime: ${INVITATION_LIFETIME:PT72H}
  identity:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8088}
    authorization-lifetime: ${OAUTH_AUTHORIZATION_LIFETIME:PT5M}
    reauthentication-window: ${OAUTH_REAUTHENTICATION_WINDOW:PT10M}
    providers:
      google:
        enabled: ${GOOGLE_LOGIN_ENABLED:false}
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
      github:
        enabled: ${GITHUB_LOGIN_ENABLED:false}
        client-id: ${GITHUB_CLIENT_ID:}
        client-secret: ${GITHUB_CLIENT_SECRET:}
  security:
    authentication:
      max-attempts-per-minute: ${AUTH_MAX_ATTEMPTS_PER_MINUTE:20}
    account-tokens:
      verification-lifetime: ${EMAIL_VERIFICATION_LIFETIME:PT24H}
      reset-lifetime: ${PASSWORD_RESET_LIFETIME:PT30M}
      resend-cooldown: ${ACCOUNT_MAIL_COOLDOWN:PT60S}
      admission-decision-lifetime: ${PLATFORM_ADMISSION_DECISION_LIFETIME:PT24H}
  mail:
    from: ${MAIL_FROM:Dependency Intelligence <no-reply@dependency.local>}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8088}
    preview-enabled: ${MAIL_PREVIEW_ENABLED:false}
    preview-url: ${MAIL_PREVIEW_URL:http://127.0.0.1:8025}
    preview-user: ${MAILPIT_UI_USER:}
    preview-password: ${MAILPIT_UI_PASSWORD:}
