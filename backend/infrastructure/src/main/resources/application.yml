spring:
  application:
    name: dependency-intelligence
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:dependency_intelligence}
    username: ${DB_RUNTIME_USER:dependency_app}
    password: ${POSTGRES_APP_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    user: ${MIGRATION_USER:${POSTGRES_USER:dependency}}
    password: ${MIGRATION_PASSWORD:${POSTGRES_PASSWORD}}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
app:
  security:
    authentication:
      max-attempts-per-minute: ${AUTH_MAX_ATTEMPTS_PER_MINUTE:20}
