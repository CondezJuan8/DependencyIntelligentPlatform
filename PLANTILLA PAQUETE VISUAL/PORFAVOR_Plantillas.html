<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plantillas visuales · PORFAVOR</title><style>:root{color-scheme:dark;--bg:#101722;--side:#0e1520;--panel:#161f2e;--raised:#1b2637;--inset:#111a27;--line:#2d394b;--line-strong:#415068;--ink:#f5f2eb;--muted:#abb7c8;--soft:#8798af;--amber:#f2bc79;--amber-dark:#2a1b0c;--amber-bg:#382b22;--mint:#94dcc2;--mint-bg:#1c3736;--rose:#f3a3a1;--rose-bg:#3b292f;--blue:#afcafc;--blue-bg:#253554;--paper:#f1ddbf;--paper-ink:#282012;--radius:13px;--mono:"Liberation Mono",Consolas,monospace;--sans:"Open Sans",system-ui,sans-serif}
body.light{color-scheme:light;--bg:#f2eee6;--side:#e8e2d7;--panel:#fbf8f1;--raised:#f0eae0;--inset:#f6f2e9;--line:#d8cfc1;--line-strong:#b9af9e;--ink:#25281f;--muted:#555c59;--soft:#58636b;--amber:#795018;--amber-dark:#25180a;--amber-bg:#f4e5cd;--mint:#245f4b;--mint-bg:#e1eee5;--rose:#8a4343;--rose-bg:#f5e1dc;--blue:#355c89;--blue-bg:#e0e9f5;--paper:#f0d2a6;--paper-ink:#2a2217}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);min-height:100vh}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button,a{cursor:pointer}
a{color:inherit;text-decoration:none}
button{color:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
svg.ico{width:17px;height:17px;flex:none;vertical-align:middle}
h1,h2,h3,p{margin:0}
h1{font-size:47px;line-height:1.03;letter-spacing:-.054em;font-weight:700}
h2{font-size:20px;line-height:1.24;letter-spacing:-.027em;font-weight:700}
h3{font-size:15px;line-height:1.45;font-weight:650}
small,.small{font-size:12px}
.muted{color:var(--muted)}
.soft{color:var(--soft)}
.accent{color:var(--amber)}
.mono,code,kbd{font-family:var(--mono);font-size:.91em}
code{overflow-wrap:anywhere}
.eyebrow{display:flex;align-items:center;gap:8px;font:11px/1.4 var(--mono);font-weight:bold;letter-spacing:.12em;color:var(--amber);text-transform:uppercase}
.eyebrow:before{content:"";width:15px;height:1px;background:currentColor}
.stack{display:grid;gap:16px}
.stack.tight{gap:9px}
.row,.between,.actions,.inline{display:flex;align-items:center;gap:10px}
.row.wrap,.actions{flex-wrap:wrap}
.inline{gap:7px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.right{text-align:right}
.nowrap{white-space:nowrap}
.center{text-align:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.cols.wide{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.cols.third{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols.equal{align-items:stretch}
.separator{height:1px;background:var(--line);margin:5px 0}
.btn{min-height:37px;display:inline-flex;justify-content:center;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:8px;padding:7px 12px;background:var(--raised);font-size:12px;font-weight:650;line-height:1.3;text-align:center;white-space:nowrap}
.btn:hover{border-color:var(--amber)}
.btn.primary{background:#f2bc79;border-color:#f2bc79;color:#291b0d}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.link{border-color:transparent;background:transparent;color:var(--amber);padding-left:3px;padding-right:3px}
.btn.danger{background:var(--rose-bg);color:var(--rose);border-color:var(--rose)}
.btn.icon{padding:0;width:37px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px}
.tag{padding:4px 7px;border-radius:5px;color:var(--muted);background:var(--raised);border:1px solid transparent;display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:1.15;font-weight:650;white-space:nowrap}
.tag i,.status-dot{width:6px;height:6px;display:inline-block;border-radius:50%;background:currentColor;flex:none}
.tag.amber,.notice.amber{background:var(--amber-bg);color:var(--amber)}
.tag.mint,.notice.mint{background:var(--mint-bg);color:var(--mint)}
.tag.rose,.notice.rose{background:var(--rose-bg);color:var(--rose)}
.tag.blue,.notice.blue{background:var(--blue-bg);color:var(--blue)}
.notice{border:1px solid currentColor;border-radius:9px;background:var(--raised);padding:11px 13px;font-size:12px;display:flex;align-items:flex-start;gap:10px;color:var(--muted)}
.notice>svg{margin-top:2px}
.notice strong{display:block;font-size:13px;margin-bottom:2px}
.notice .btn{margin-left:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.pad{padding:18px}
.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:17px 18px}
.panel-head p{margin-top:4px}
.panel-foot{padding:11px 17px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.inset{background:var(--inset);border:1px solid var(--line);border-radius:9px;padding:13px}
.tile{height:37px;width:37px;display:grid;place-items:center;border-radius:9px;background:var(--raised);border:1px solid var(--line);color:var(--amber);flex:none}
.tile.cream{background:var(--paper);color:var(--paper-ink);border:0}
.tile svg{width:19px;height:19px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-name{font-size:20px;font-weight:800;letter-spacing:-.065em;line-height:1.1}
.brand small{display:block;font:9px/1.45 var(--mono);color:var(--muted);letter-spacing:.02em;margin-top:4px}
.brand-mark{width:31px;height:31px;flex:none;position:relative;display:block;background:#f2bc79;border-radius:8px}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;width:11px;height:11px;border:2px solid #261a10;transform:rotate(45deg);border-radius:2px;top:9px}
.brand-mark:before{left:6px}.brand-mark:after{right:6px}
.app{display:grid;grid-template-columns:222px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:100vh;padding:23px 14px 15px;position:sticky;top:0;height:100vh;z-index:4}
.sidebar>.brand{padding:0 6px;margin-bottom:25px}
.space-choice{display:flex;align-items:center;gap:9px;min-height:54px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px;margin-bottom:16px}
.space-choice .tile{width:31px;height:31px;font:12px var(--mono);font-weight:bold;background:var(--amber-bg);border:0}
.space-choice small,.identity small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.space-choice strong{display:block;font-size:12px;line-height:1.2}
nav{display:grid;gap:12px;overflow:auto}
.nav-group{display:grid;gap:2px}
.nav-label{font:10px/1.4 var(--mono);font-weight:bold;text-transform:uppercase;letter-spacing:.12em;color:var(--soft);padding:8px 9px 5px}
.navlink{display:flex;align-items:center;gap:9px;border-radius:7px;border:1px solid transparent;padding:8px 8px;color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;position:relative}
.navlink svg{width:15px;height:15px}
.navlink:hover{background:var(--panel)}
.navlink.active{color:var(--amber);background:var(--amber-bg);border-color:color-mix(in srgb,var(--amber) 27%,transparent)}
.navlink.active:before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:2px;background:var(--amber);border-radius:2px}
.navlink .inline-count{margin-left:auto;font:10px var(--mono)}
.identity{margin-top:auto;border-top:1px solid var(--line);padding:13px 5px 0}
.avatar{height:34px;width:34px;border:1px solid var(--line-strong);background:var(--blue-bg);color:var(--blue);border-radius:50%;display:grid;place-items:center;font:11px var(--mono);font-weight:bold;flex:none}
.identity strong{display:block;font-size:12px;line-height:1.2}
.top{height:67px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 30px;background:var(--side);position:relative;z-index:3}
.crumb{font-size:12px;color:var(--muted);white-space:nowrap}
.crumb b{color:var(--ink);font-weight:650}
.crumb svg{width:13px}
.top-actions{display:flex;align-items:center;gap:8px}
.quick{display:flex;align-items:center;gap:8px;min-width:208px;justify-content:flex-start;color:var(--muted);margin-right:4px}
kbd{border:1px solid var(--line-strong);border-radius:4px;padding:2px 4px;color:var(--muted);font-size:10px;line-height:1}
.quick kbd{margin-left:auto}
.top .avatar{width:33px;height:33px}
.bell{position:relative}
.bell:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;right:6px;top:6px;background:var(--amber)}
.mobile-menu{display:none}
.content{max-width:1500px;margin:0 auto;padding:25px 30px 28px;display:grid;gap:17px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin:2px 0 4px}
.pagehead .eyebrow{margin-bottom:9px}
.pagehead p{margin-top:8px}
.pagehead aside{padding-bottom:2px}
.footer-note{font-size:11px;color:var(--soft);display:flex;align-items:center;gap:6px}
.footer-note svg{width:13px;height:13px}
.metric-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:3px 0}
.metric{padding:12px 16px;border-right:1px solid var(--line)}
.metric:last-child{border:0}
.metric span{display:block;color:var(--muted);font-size:11px;font-weight:650}
.metric strong{font-size:32px;line-height:1.12;letter-spacing:-.065em;display:block;margin:4px 0 3px;font-variant-numeric:tabular-nums}
.metric small{font-size:10px;color:var(--soft)}
.field{display:grid;gap:5px;min-width:0;color:var(--muted);font-weight:650;font-size:12px}
.field input,.field select,.field textarea,.searchbox{border:1px solid var(--line-strong);border-radius:8px;background:var(--inset);color:var(--ink);min-height:38px;padding:7px 10px;width:100%;font-size:13px}
.field textarea{min-height:72px;resize:vertical}
.field small{font-weight:400;color:var(--soft);font-size:11px}
.field input[readonly]{color:var(--soft);border-style:dashed}
.field input::placeholder,.field textarea::placeholder{color:var(--soft)}
.searchbox{display:flex;align-items:center;gap:8px;color:var(--muted)}
.searchbox input{min-width:0;flex:1;background:transparent;border:0;padding:0;color:var(--ink);outline:0!important}
.searchbox:focus-within{outline:2px solid var(--amber);outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;align-items:end;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line)}
.filters .field{min-width:120px;flex:1}
.filters .field.search-field{min-width:195px;flex:1.65}
.tabs{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding:0 16px;overflow:auto;scrollbar-width:thin}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:11px 2px 9px;white-space:nowrap;font-size:12px;font-weight:650}
.tab.active{color:var(--amber);border-color:var(--amber)}
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--inset);border:1px solid var(--line);border-radius:9px}
.seg .tab{padding:6px 9px;border:0;border-radius:6px}
.seg .tab.active{background:var(--amber-bg);color:var(--amber)}
.table-scroll{width:100%;overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}
th{font-size:10px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:9px 12px;background:var(--inset);white-space:nowrap;text-align:left}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
td small,td .sub{display:block;margin-top:3px;color:var(--muted);font-size:10px}
td:first-child,th:first-child{padding-left:17px}
td:last-child,th:last-child{padding-right:17px}
td a:hover{text-decoration:underline}
.table-arrow{white-space:nowrap;color:var(--amber)}
.list{display:grid}
.list-row{padding:9px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;font-size:12px}
.list-row:last-child{border-bottom:0}
.list-row small{display:block;font-size:10px}
.checkrow{min-height:36px;display:flex;align-items:center;gap:8px;font-size:12px}
input[type=checkbox]{accent-color:#e5a65a;width:15px;height:15px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:18px}
.signal-card{border-radius:var(--radius);background:var(--paper);color:var(--paper-ink);padding:20px 23px;position:relative;isolation:isolate;overflow:hidden;min-height:250px}
.signal-card .eyebrow{color:#6f430f}
.signal-card h2{font-size:30px;margin-top:8px}
.signal-number{display:flex;gap:11px;align-items:baseline;margin-top:10px}
.signal-number b{font-size:58px;line-height:.94;letter-spacing:-.09em}
.signal-number span{font-weight:700;font-size:14px}
.signal-card p{font-size:12px;color:#57422b;margin-top:9px;max-width:320px}
.signal-card .btn{margin-top:13px;background:#2c2117;color:#fff5e5;border-color:#2c2117}
.orbits{position:absolute;right:-9%;top:-12%;width:61%;height:135%;z-index:-1;opacity:.67;background:repeating-radial-gradient(ellipse at 65% 50%,transparent 0 15px,#a6672c55 16px 17px,transparent 18px 25px),linear-gradient(102deg,transparent 2%,#ce924d52)}
.orbits:after,.orbits:before{content:"";position:absolute;border-radius:50%;background:#9f5a1c;width:7px;height:7px;box-shadow:0 0 0 5px #b7773e3c}
.orbits:after{top:35%;left:55%}.orbits:before{top:60%;left:36%}
.rail{height:8px;width:100%;border-radius:8px;display:flex;gap:3px;overflow:hidden;background:var(--line)}
.rail span{min-width:4px}
.rail .mint{background:#80c6ad}.rail .amber{background:#ebb66f}.rail .rose{background:#e88d8e}.rail .blue{background:#9ab6e5}.rail .gray{background:#55647a}
.legend{display:flex;flex-wrap:wrap;gap:9px 15px;font-size:11px;color:var(--muted)}
.legend b{color:var(--ink)}
.legend i{margin-right:4px}
.progress{height:7px;background:var(--line);border-radius:10px;overflow:hidden}
.progress span{display:block;height:100%;background:#edb776}
.dashed{border-style:dashed}
.quote{border-left:2px solid var(--amber);padding:7px 0 7px 11px;color:var(--muted);font-size:12px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-bottom:1px solid var(--line);padding-bottom:13px}
.meta-grid span{display:block;color:var(--soft);font-size:11px}
.meta-grid strong{font-size:13px}
.toast{position:fixed;right:22px;bottom:22px;z-index:12;padding:10px 14px;border:1px solid var(--line-strong);border-radius:9px;background:var(--raised);color:var(--ink);box-shadow:0 10px 30px #0005}
.auth{min-height:100vh;display:grid;grid-template-columns:46% 54%;background:var(--bg)}
.auth-art{display:flex;flex-direction:column;justify-content:space-between;background:#111c2b;position:relative;isolation:isolate;overflow:hidden;padding:49px 54px;color:#f5f0e5;border-right:1px solid #354151}
.auth-art .brand small{color:#aebacf}
.auth-art>.contours{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 82% 68%,#81532851,transparent 52%),repeating-radial-gradient(ellipse at 95% 69%,transparent 0 25px,#d99e5729 26px 27px,transparent 28px 35px);mask-image:linear-gradient(to bottom,transparent 4%,#000 37%)}
.auth-art>.frame-detail{position:absolute;width:49%;height:35%;right:-10%;top:29%;border:1px solid #d69b5555;transform:rotate(-30deg);border-radius:28px;z-index:-1}
.auth-copy{max-width:440px;margin-bottom:70px}
.auth-copy .eyebrow{color:#f2bc79;margin-bottom:17px}
.auth-copy h1{font-size:64px;line-height:.99;color:#faefe0}
.auth-copy h1 em{font-style:normal;color:#f2bc79}
.auth-copy p{margin-top:18px;max-width:325px;color:#c7c9ce}
.auth-foot{display:flex;gap:11px;color:#b9b9c2;font:11px var(--mono);align-items:center}
.auth-main{padding:36px 30px 34px;display:grid;align-content:center;justify-items:center;position:relative}
.auth-main>.auth-switch{position:absolute;top:24px;right:29px}
.auth-form{width:min(100%,470px);display:grid;gap:14px}
.auth-form h1{font-size:40px}
.auth-form .field input{min-height:43px}
.auth-form .provider{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.auth-form .provider .btn{min-height:41px}
.auth-form .between .btn{min-height:auto}
.status-board{width:min(100%,528px);display:grid;gap:16px}
.status-board h1{font-size:43px}
.status-step{display:grid;grid-template-columns:29px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.status-step .tile{width:28px;height:28px}
.status-step .tile svg{width:14px;height:14px}
.status-step p{font-size:11px;color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:8;background:#070d18ac;display:flex;align-items:flex-start;justify-content:center;padding:112px 30px 24px;overflow:auto}
.dialog{width:min(100%,553px);background:var(--panel);border:1px solid var(--line-strong);border-radius:15px;box-shadow:0 22px 70px #0007}
.dialog>header,.dialog>footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px}
.dialog>header{border-bottom:1px solid var(--line)}
.dialog>footer{border-top:1px solid var(--line);justify-content:flex-end}
.dialog .body{padding:16px 18px;display:grid;gap:12px}
.overlay.drawer-wrap{justify-content:flex-end;padding:0}
.drawer{width:min(100%,490px);min-height:100%;border-radius:0;border-top:0;border-bottom:0;align-self:stretch}
.popover{position:absolute;right:30px;top:58px;width:328px;z-index:5;box-shadow:0 17px 50px #0006;border-color:var(--line-strong)}
.popover .list-row{padding:8px}
.command-result{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;background:transparent;border:1px solid transparent;text-align:left;border-radius:7px;color:var(--muted)}
.command-result:hover,.command-result.selected{background:var(--amber-bg);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 25%,transparent)}
.command-result strong{color:inherit}
.sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}
.assistant-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:17px}
.chat{display:grid;gap:13px;padding:15px 17px}
.message{padding:11px 13px;border-radius:9px;border:1px solid var(--line);font-size:13px}
.message.user{background:var(--raised);max-width:87%;justify-self:end}
.message.nexo{background:var(--inset)}
.message p+p{margin-top:8px}
.chat-input{border-top:1px solid var(--line);padding:12px 16px}
.cite{display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:var(--amber-bg);color:var(--amber);min-width:18px;height:18px;font:10px var(--mono);margin-left:4px;border:0}
.permissions td:not(:first-child),.permissions th:not(:first-child){text-align:center}
.flow-board{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}
.flow-board .panel{height:100%}
.flow-board h2{margin:10px 0 6px}
.flow-board .stack{margin-top:12px}
@media(max-width:1200px){.sidebar{padding-left:10px;padding-right:10px}.app{grid-template-columns:196px minmax(0,1fr)}.quick{min-width:150px}.content,.top{padding-left:22px;padding-right:22px}}
@media(max-width:980px){.app{grid-template-columns:minmax(0,1fr)}.sidebar{display:none;position:fixed;left:0;top:0;bottom:0;width:248px;height:100dvh;z-index:8}.sidebar.open{display:flex}.mobile-menu{display:inline-flex}.menu-shade{position:fixed;inset:0;background:#070d18ac;z-index:7}.auth-art{padding:38px 30px}.auth-copy h1{font-size:52px}.content{max-width:960px}}

function doAction(action,el){

 if(action==='spaces'){popover('Organizaciones',`${listRow('Omega Labs','Propietario',tag('Activa','mint'),'building-2')}${listRow('Atlas Studio','Lector',btn('Usar vista de lector',{kind:'ghost',action:'viewer'}),'building-2')}${btn('Volver a vista administradora',{kind:'link',action:'admin-role'})}`);return}
 if(action==='viewer'||action==='admin-role'){accessRole=action==='viewer'?'viewer':'admin';location.hash='dashboard';navigate();return}
 if(action==='notifications'){popover('Notificaciones',`${listRow('Aviso OSV actualizado','servicios-core · 25 nov',routeArrow('Abrir','vulnerabilidades'),'shield-alert')}${listRow('35 versiones por consultar','Inventario de repositorios accesibles',routeArrow('Ver','inventario'),'clock-3')}${notice('Cobertura de notificaciones','Hay repositorios con consulta incompleta.','amber')}`);return}
 if(action==='advisory'){const a=document.querySelector('#advisory');a.hidden=!a.hidden;el.setAttribute('aria-expanded',String(!a.hidden));return}
 if(action==='reject-account'){adminReason('Rechazar solicitud',undefined,true);return}
 if(action==='disable-resource'||action==='enable-resource'||action==='remove-resource'){adminReason({'disable-resource':'Deshabilitar registro','enable-resource':'Habilitar registro','remove-resource':'Retirar registro'}[action], 'Registro seleccionado',action!=='enable-resource');return}
 if(action==='commit-admin'){const area=main.querySelector('.dialog textarea');if(!area.value.trim()){area.reportValidity();area.focus();return}clearOverlay();toast('Acción registrada en la auditoría de demostración.');return}
 if(action==='done'){clearOverlay();toast('Acción de demostración completada.');return}
 if(action==='cite-one'||action==='cite-two'){const cite=document.getElementById(action);cite?.scrollIntoView({block:'nearest'});cite?.animate([{outline:'2px solid var(--amber)'},{outline:'2px solid transparent'}],800);return}
 if(action==='copy'){
  const phrase=document.getElementById('prompt-text').textContent;
  navigator.clipboard?.writeText(phrase).then(()=>toast('Prompt copiado')).catch(()=>toast('Selecciona el texto del prompt para copiarlo.'));
  return;
 }
 if(action==='tab'){
  for(const tab of el.parentElement.children)tab.classList.toggle('active',tab===el);
  if(current()==='comparacion'){
   const rows=el.parentElement.closest('.panel').querySelectorAll('tbody tr');
   const matches={'Todos':'','Agregadas':'Agregada','Actualizadas':'Actualizada','Retiradas':'Retirada','Sin cambios':'Sin cambios'};
   for(const row of rows)row.hidden=!row.cells[1].textContent.includes(matches[el.textContent]);
  }
  return;
 }
 if(action in staticDialogs){const [title,sub,body,label,kind]=staticDialogs[action];modal(title,sub,body,cancel()+confirmBtn(label,'check',kind));return}
 if(action in simpleActions){toast(simpleActions[action]);}

});
document.addEventListener('keydown',e=>{
 const dialog=main.querySelector('.dialog');
 const commandField=document.querySelector('#command-input');
 if(e.key==='Escape'){clearOverlay();if(main.querySelector('.sidebar.open'))menu();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){if(main.querySelector('.top')){e.preventDefault();command()}return}
 if(commandField===document.activeElement&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){
  const links=[...main.querySelectorAll('.command-result:not([hidden])')];
  if(!links.length)return;
  e.preventDefault();
  const idx=links.findIndex(a=>a.classList.contains('selected'));
  if(e.key==='Enter'){links[Math.max(0,idx)].click();return}
  links[idx]?.classList.remove('selected');
  links[(idx+(e.key==='ArrowDown'?1:-1)+links.length)%links.length].classList.add('selected');
 }
 if(e.key==='Tab'&&dialog){
  const controls=[...dialog.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])')].filter(x=>x.getClientRects().length);
  const first=controls[0],last=controls.at(-1);
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}
  if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}
 }
});
