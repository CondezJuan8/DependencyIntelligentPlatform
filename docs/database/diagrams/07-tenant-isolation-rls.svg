<text x="0" y="24.0" font-family="monospace" font-size="24" fill="#1e293b">Aislamiento tenant y roles SQL</text>
<text x="0" y="56.0" font-family="monospace" font-size="14" fill="#1e293b">Flujo de seguridad del esquema real; RLS no sustituye autorización. Identidades globales se controlan desde autenticación.</text>
<text x="0" y="86.0" font-family="monospace" font-size="14" fill="#1e293b">PK / U = participa en clave (puede ser compuesta); FK = referencia; ? = nullable</text>
<text x="0" y="103.5" font-family="monospace" font-size="14" fill="#1e293b">Azul: tenant/RLS · Gris: global · Blanco: referencia externa al módulo · conectores ER: 0..N → 1/0..1</text>
