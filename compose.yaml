name: dependency-intelligence
services:
  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
  ollama:
    image: ollama/ollama:0.40.17
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    networks:
      - ai_internal
      - ollama_egress
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
  ollama-model-init:
    image: ollama/ollama:0.40.17
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma-2:latest}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${OLLAMA_EMBEDDING_MODEL}\""]
    networks:
      - ai_internal
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
  database:
    image: dependency-intelligence-postgres:17.7-alpine-pgvector-0.8.7
    build:
      context: ./infra/database
      dockerfile: Dockerfile.pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dependency_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-dependency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Define POSTGRES_APP_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/database/init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
      - ./infra/database/provision-runtime.sql:/opt/dependency/provision-runtime.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_HOST: database
      POSTGRES_DB: ${POSTGRES_DB:-dependency_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-dependency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env}
      DB_RUNTIME_USER: dependency_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Define POSTGRES_APP_PASSWORD en .env}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AUTH_MAX_ATTEMPTS_PER_MINUTE: ${AUTH_MAX_ATTEMPTS_PER_MINUTE:-20}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@dependency.local}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${WEB_PORT:-8088}}
      EMAIL_VERIFICATION_LIFETIME: ${EMAIL_VERIFICATION_LIFETIME:-PT24H}
      PASSWORD_RESET_LIFETIME: ${PASSWORD_RESET_LIFETIME:-PT30M}
      ACCOUNT_MAIL_COOLDOWN: ${ACCOUNT_MAIL_COOLDOWN:-PT60S}
      PLATFORM_ADMISSION_DECISION_LIFETIME: ${PLATFORM_ADMISSION_DECISION_LIFETIME:-PT24H}
      GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_LOGIN_ENABLED: ${GITHUB_LOGIN_ENABLED:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_APP_ENABLED: ${GITHUB_APP_ENABLED:-false}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY_BASE64: ${GITHUB_APP_PRIVATE_KEY_BASE64:-}
      GITHUB_APP_CALLBACK_URL: ${GITHUB_APP_CALLBACK_URL:-http://localhost:${WEB_PORT:-8088}/api/integrations/github/app-callback}
      GITHUB_APP_API_BASE_URL: ${GITHUB_APP_API_BASE_URL:-https://api.github.com}
      LOCAL_REPOSITORY_STORAGE_ROOT: /var/lib/dependency-intelligence/repositories
      APP_DOCUMENTS_STORAGE_ROOT: /var/lib/dependency-intelligence/documents
      OSV_API_BASE_URL: ${OSV_API_BASE_URL:-https://api.osv.dev}
      OSV_CONNECT_TIMEOUT: ${OSV_CONNECT_TIMEOUT:-PT5S}
      OSV_READ_TIMEOUT: ${OSV_READ_TIMEOUT:-PT15S}
      OSV_ASSESSMENT_MAX_AGE: ${OSV_ASSESSMENT_MAX_AGE:-PT24H}
      OSV_BATCH_SIZE: ${OSV_BATCH_SIZE:-100}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-}
      OLLAMA_EMBEDDING_REVISION: ${OLLAMA_EMBEDDING_REVISION:-}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-PT45S}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.2-sol}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com}
      DEPENDENCY_INTELLIGENCE_SCANNER_CDXGEN_URL: http://cdxgen-scanner:9090
      DEPENDENCY_INTELLIGENCE_SCANNER_WORKSPACE: /app/scanner-work
      OAUTH_AUTHORIZATION_LIFETIME: ${OAUTH_AUTHORIZATION_LIFETIME:-PT5M}
      OAUTH_REAUTHENTICATION_WINDOW: ${OAUTH_REAUTHENTICATION_WINDOW:-PT10M}
      INVITATION_LIFETIME: ${INVITATION_LIFETIME:-PT72H}
    volumes:
      - repository_data:/var/lib/dependency-intelligence/repositories
      - document_data:/var/lib/dependency-intelligence/documents
      - scanner_work:/app/scanner-work
    networks:
      - default
      - ai_internal
      - scanner_internal
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
      scanner-work-init:
        condition: service_completed_successfully
      cdxgen-scanner:
        condition: service_healthy
  scanner-work-init:
    image: dependency-intelligence-backend
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /app/scanner-work && chown app:app /app/scanner-work && chmod 0755 /app/scanner-work"]
    network_mode: none
    volumes:
      - scanner_work:/app/scanner-work
    restart: "no"
  cdxgen-scanner:
    image: ghcr.io/cdxgen/cdxgen-secure:13.8.0@sha256:3a59d95320b5d70f7b369af4ed4ad92c0fe931a426374e0f9df942129e23b8ad
    environment:
      CDXGEN_SECURE_MODE: "true"
      CDXGEN_SERVER_ALLOWED_PATHS: /app/scanner-work
      CDXGEN_ALLOWED_PATHS: /app/scanner-work
      CDXGEN_GIT_ALLOWED_HOSTS: invalid.invalid
      CDXGEN_GIT_ALLOW_PROTOCOL: https
      CDXGEN_INSTALL_DEPS: "false"
      CDXGEN_SERVER_TIMEOUT_MS: "300000"
      NODE_OPTIONS: >-
        --permission
        --allow-fs-read="/app/*"
        --allow-fs-read="/opt/*"
        --allow-fs-read="/home/cyclonedx/*"
        --allow-fs-read="/tmp/cdxgen-temp/*"
        --allow-fs-write="/tmp/cdxgen-temp/*"
        --allow-fs-write="/app/*.json"
        --allow-child-process
        --allow-net
        --trace-warnings
    entrypoint: ["/bin/sh", "-c"]
    command: ["unset SWIFT_SIGNING_KEY; exec cdxgen --server --server-host cdxgen-scanner --server-port 9090"]
    expose:
      - "9090"
    volumes:
      - scanner_work:/app/scanner-work:ro
    networks:
      - scanner_internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://cdxgen-scanner:9090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      scanner-work-init:
        condition: service_completed_successfully
  platform-admin-bootstrap:
    profiles: ["bootstrap"]
    build:
      context: ./backend
      args:
        OPERATOR_TOOL_IMAGE: "true"
    environment:
      DB_HOST: database
      POSTGRES_DB: ${POSTGRES_DB:-dependency_intelligence}
      DB_RUNTIME_USER: ${MIGRATION_USER:-${POSTGRES_USER:-dependency}}
      POSTGRES_APP_PASSWORD: ${MIGRATION_PASSWORD:-${POSTGRES_PASSWORD:?Copia .env.example a .env}}
      MIGRATION_USER: ${MIGRATION_USER:-${POSTGRES_USER:-dependency}}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:-${POSTGRES_PASSWORD:?Copia .env.example a .env}}
      APP_DATABASE_ENFORCE_RUNTIME_ROLE: "false"
      GITHUB_APP_ENABLED: "false"
      GOOGLE_LOGIN_ENABLED: "false"
      GITHUB_LOGIN_ENABLED: "false"
      WEB_PORT: ${WEB_PORT:-8088}
    command:
      - --spring.profiles.active=platform-admin-bootstrap
      - --spring.main.web-application-type=none
    stdin_open: true
    tty: true
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - backend
volumes:
  postgres_data:
  repository_data:
  document_data:
  scanner_work:
  ollama_data:
networks:
  scanner_internal:
    internal: true
  ai_internal:
    internal: true
  ollama_egress:
