<aside class="sidebar" [class.open]="opened()" [attr.aria-label]="'Navegación principal' | t">
  <button class="brand" (click)="go('dashboard')">
    <img src="/brand-mark.svg" alt="" width="33" height="37" />
    <span>Dependency Intelligence</span>
  </button>
  <nav>
    @for (group of navigationGroups; track group.label) {
      <section class="nav-group" [attr.aria-label]="group.label | t">
        <h2>{{ group.label | t }}</h2>
        @for (item of group.items; track item.id) {
          <button
            type="button"
            (click)="go(item.id)"
            [class.active]="page() === item.id"
            [attr.aria-current]="page() === item.id ? 'page' : null"
            [attr.title]="item.label | t"
          >
            <app-di-icon [name]="item.icon" /><span>{{ item.label | t }}</span>
            @if (!item.ready) {
              <i aria-hidden="true"></i><span class="sr-only">{{ 'En preparación' | t }}</span>
            }
          </button>
        }
      </section>
    }
  </nav>
  <div class="sidebar-foot"><strong>Alcance aplicado</strong>Los permisos se respetan por organización y repositorio.</div>
</aside>
