<aside class="sidebar" [class.open]="opened()" aria-label="Navegación principal">
  <button class="brand" (click)="go('dashboard')">
    <img src="/brand-mark.svg" alt="" width="33" height="37" /><span
      >Dependency<br />Intelligence</span
    >
  </button>
  <span class="nav-heading">ESPACIO DE TRABAJO</span>
  <nav>
    @for (item of navigation; track item.id) {
      <button
        (click)="go(item.id)"
        [class.active]="page() === item.id"
        [attr.aria-current]="page() === item.id ? 'page' : null"
        [attr.title]="item.ready ? item.label : item.label + ': en preparación'"
      >
        <app-di-icon [name]="item.icon" /><span>{{ item.label }}</span>
        @if (!item.ready) {
          <i aria-hidden="true"></i><span class="sr-only">En preparación</span>
        }
      </button>
    }
  </nav>
  <div class="workspace-card">
    <span class="local-indicator"></span><strong>Tu espacio de trabajo</strong>
    <p>Organiza tu equipo.<br />Construye con perspectiva.</p>
    <button (click)="go('organization')">
      Gestionar organización <app-di-icon name="arrow" />
    </button>
  </div>
  <div class="sidebar-footer">DEPENDENCY INTELLIGENCE</div>
</aside>
