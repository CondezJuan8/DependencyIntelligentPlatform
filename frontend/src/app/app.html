<main>
  <header>
    <div>
      <h1>Dependency Intelligence</h1>
      <p>Inventario y trazabilidad de dependencias</p>
    </div>
    @if (session.account(); as account) {
      <div class="account">
        <span>{{ account.displayName }}</span>
        <button mat-stroked-button type="button" (click)="logout()" [disabled]="pending()">Cerrar sesión</button>
      </div>
    }
  </header>
  @if (error()) {
    <div class="error" role="alert">{{ error() }} <button mat-button (click)="restore()">Reintentar</button></div>
  }
  @if (loading()) { <p role="status">Comprobando sesión…</p> }
  @else if (links.action()) { <app-account-action /> }
  @else if (session.account()) { <app-email-verification /><app-organization-workspace /> }
  @else if (!error()) { <app-access-form /> }
</main>
